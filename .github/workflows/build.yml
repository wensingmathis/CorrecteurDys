name: Compiler et tester l'APK
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4
      - name: Installer Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Installer Android SDK 35
        shell: bash
        run: |
          set -e
          sdk_root="${ANDROID_HOME:-${ANDROID_SDK_ROOT:-/usr/local/lib/android/sdk}}"
          sdkmanager_bin="$(find "$sdk_root/cmdline-tools" -type f -name sdkmanager -print -quit)"
          if [[ -z "$sdkmanager_bin" ]]; then
            echo "sdkmanager introuvable sous $sdk_root/cmdline-tools" >&2
            exit 1
          fi
          printf 'ANDROID_HOME=%s\nANDROID_SDK_ROOT=%s\n' "$sdk_root" "$sdk_root" >> "$GITHUB_ENV"
          set +o pipefail
          yes 2>/dev/null | "$sdkmanager_bin" --licenses >/dev/null
          set -o pipefail
          "$sdkmanager_bin" --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"
          test -d "$sdk_root/platforms/android-35"
          test -d "$sdk_root/build-tools/35.0.0"
      - name: Configurer Gradle via le wrapper
        uses: gradle/actions/setup-gradle@v4
      - name: Vérifier les dépendances
        run: ./gradlew --no-daemon --stacktrace :app:dependencies
      - name: Tests unitaires
        run: ./gradlew --no-daemon --stacktrace :app:testDebugUnitTest
      - name: Construire APK debug
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug
      - name: Vérifier l'APK
        shell: bash
        run: |
          apk="app/build/outputs/apk/debug/app-debug.apk"
          test -s "$apk" || { echo "APK absent ou vide : $apk" >&2; exit 1; }
          size="$(wc -c < "$apk")"
          if (( size < 1000000 )); then
            echo "APK anormalement petit : ${size} octets" >&2
            exit 1
          fi
          echo "APK présent : ${size} octets"
      - name: Publier APK
        uses: actions/upload-artifact@v4
        with:
          name: CorrecteurDys-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30
